{{- range $numVFs := list 1 4 }}
---
apiVersion: {{ include "k8s-dra-driver-npu.resourceApiVersion" $ }}
kind: DeviceClass
metadata:
  name: vfio-npu-vf{{ $numVFs }}.rebellions.ai
spec:
  selectors:
  - cel:
      expression: 'device.driver == {{ include "k8s-dra-driver-npu.driverName" $ | quote }} && device.attributes[{{ include "k8s-dra-driver-npu.driverName" $ | quote }}].type == "vfio" && has(device.attributes[{{ include "k8s-dra-driver-npu.driverName" $ | quote }}].vf) && device.attributes[{{ include "k8s-dra-driver-npu.driverName" $ | quote }}].vf && has(device.attributes[{{ include "k8s-dra-driver-npu.driverName" $ | quote }}].partitionMode) && device.attributes[{{ include "k8s-dra-driver-npu.driverName" $ | quote }}].partitionMode == "vf{{ $numVFs }}"'
{{- end }}
