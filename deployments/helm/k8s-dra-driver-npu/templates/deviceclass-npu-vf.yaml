{{- range $numVFs := list 1 4 }}
---
apiVersion: {{ include "k8s-dra-driver-npu.resourceApiVersion" $ }}
kind: DeviceClass
metadata:
  name: npu-vf{{ $numVFs }}.rebellions.ai
spec:
  selectors:
  - cel:
      expression: 'device.driver == {{ include "k8s-dra-driver-npu.driverName" $ | quote }} && device.attributes[{{ include "k8s-dra-driver-npu.driverName" $ | quote }}].type == "npu-vf" && has(device.attributes[{{ include "k8s-dra-driver-npu.driverName" $ | quote }}].partitionMode) && device.attributes[{{ include "k8s-dra-driver-npu.driverName" $ | quote }}].partitionMode == "vf{{ $numVFs }}"'
  extendedResourceName: rebellions.ai/npu-vf{{ $numVFs }}
{{- end }}
