{{- if .Values.webhook.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "k8s-dra-driver-npu.fullname" . }}-webhook-cert
  namespace: {{ include "k8s-dra-driver-npu.namespace" . }}
  labels:
    {{- include "k8s-dra-driver-npu.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  dnsNames:
    {{- $svcName := printf "%s-webhook" (include "k8s-dra-driver-npu.fullname" .) }}
    {{- $svcNamespace := (include "k8s-dra-driver-npu.namespace" .) }}
    - {{ $svcName }}.{{ $svcNamespace }}.svc
  issuerRef:
    kind: Issuer
    name: {{ include "k8s-dra-driver-npu.fullname" . }}-webhook-issuer
  secretName: {{ include "k8s-dra-driver-npu.fullname" . }}-webhook-cert
{{- end }}
