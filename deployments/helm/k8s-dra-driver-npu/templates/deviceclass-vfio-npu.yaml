---
apiVersion: {{ include "k8s-dra-driver-npu.resourceApiVersion" . }}
kind: DeviceClass
metadata:
  name: vfio-npu.rebellions.ai
spec:
  selectors:
  - cel:
      expression: 'device.driver == {{ include "k8s-dra-driver-npu.driverName" . | quote }} && device.attributes[{{ include "k8s-dra-driver-npu.driverName" . | quote }}].type == "vfio"'
