name: Build and push image

on:
  workflow_call:
    inputs:
      registry:
        type: string
        description: Registry address
        required: true
      image_repository:
        type: string
        description: Full image repository
        required: true
      image_tag:
        type: string
        description: The tag of the image to push
        required: true
      runner:
        type: string
        description: Runner label for the build job
        required: false
        default: sw-cloud-cluster-ci
    secrets:
      registry_id:
        description: Registry login ID
        required: true
      registry_password:
        description: Registry login password
        required: true

jobs:
  image-build-push:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install prerequisites
        run: |
          if ! command -v docker &>/dev/null; then
            curl -fsSL https://get.docker.com | sudo sh
            sudo usermod -aG docker "$USER"
            sudo chmod 666 /var/run/docker.sock
          fi
          if ! command -v make &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y make
          fi
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to registry
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_ID: ${{ secrets.registry_id }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_ID" --password-stdin

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          make -f deployments/container/Makefile build push \
            IMAGE_NAME="${{ inputs.image_repository }}" \
            IMAGE_TAG="${{ inputs.image_tag }}" \
            VERSION="${{ inputs.image_tag }}"

      - name: Tag dev (alias of the immutable commit SHA, main push only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ inputs.image_repository }}:dev" \
            "${{ inputs.image_repository }}:${{ inputs.image_tag }}"