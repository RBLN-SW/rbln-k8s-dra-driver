name: Build and push image

on:
  workflow_call:
    inputs:
      registry:
        type: string
        description: Registry address
        required: true
      image_repository:
        type: string
        description: Full image repository
        required: true
      image_tag:
        type: string
        description: The tag of the image to push
        required: true
      runner:
        type: string
        description: Runner label for the build job
        required: false
        default: sw-cloud-cluster-ci
      block:
        type: boolean
        description: Fail without pushing when the built image has fixable Critical/High CVEs
        required: false
        default: false
      sarif_category:
        type: string
        description: Code scanning category; must be unique per image scanned on the same commit
        required: false
        default: image
    secrets:
      registry_id:
        description: Registry login ID
        required: true
      registry_password:
        description: Registry login password
        required: true

jobs:
  image-build-push:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install prerequisites
        run: |
          if ! command -v docker &>/dev/null; then
            curl -fsSL https://get.docker.com | sudo sh
            sudo usermod -aG docker "$USER"
            sudo chmod 666 /var/run/docker.sock
          fi
          if ! command -v make &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y make
          fi
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to registry
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_ID: ${{ secrets.registry_id }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_ID" --password-stdin

      # Build, scan, then push. Scanning after the push would leave a vulnerable
      # tag publicly pullable even when the gate fails, because the gate only
      # blocks the manifest that promotes it to :vX.Y.Z and :latest — anyone
      # referencing the per-arch tag directly would bypass it.
      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          make -f deployments/container/Makefile build \
            IMAGE_NAME="${{ inputs.image_repository }}" \
            IMAGE_TAG="${{ inputs.image_tag }}" \
            VERSION="${{ inputs.image_tag }}"

      - name: Scan image
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ inputs.image_repository }}:${{ inputs.image_tag }}
          sarif-category: ${{ inputs.sarif_category }}
          block: ${{ inputs.block }}

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail
          make -f deployments/container/Makefile push \
            IMAGE_NAME="${{ inputs.image_repository }}" \
            IMAGE_TAG="${{ inputs.image_tag }}" \
            VERSION="${{ inputs.image_tag }}"

      - name: Tag dev (alias of the immutable commit SHA, main push only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ inputs.image_repository }}:dev" \
            "${{ inputs.image_repository }}:${{ inputs.image_tag }}"
