name: PR Validation

on:
  pull_request:
    branches:
      - main
      # Backport PRs need the same required checks as main PRs. The obedients PR
      # pipeline's branch filter must include release-* as well (obedients-side setting).
      - "release-*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  statuses: write
  security-events: write # image-scan.yaml uploads SARIF to code scanning

jobs:
  pr-title-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          scopes: |
            .*
          requireScope: false
          subjectPattern: ^.{1,100}$
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    needs: pr-title-validation
    uses: ./.github/workflows/lint.yaml
    secrets: inherit
  manifests-check:
    needs: pr-title-validation
    uses: ./.github/workflows/manifests.check.yaml
    secrets: inherit
  # Buildkite builds and pushes the PR image used by its DRA scenario.
  # This scan builds a separate local image and is advisory: findings fail
  # the job, but it is not required by protect-main/release-branches, so a
  # base-image CVE that lands overnight does not block unrelated PRs.
  # Findings remain visible in the security tab and nightly notifications.
  image-scan:
    needs: [lint, manifests-check]
    uses: ./.github/workflows/image-scan.yaml
    secrets: inherit
    with:
      fail-on-findings: true
