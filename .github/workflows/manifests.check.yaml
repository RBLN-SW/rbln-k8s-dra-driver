name: Manifests Checks

on:
  workflow_call:

jobs:
  # Check manifests
  helm-lint:
    name: helm lint
    runs-on: rbln-sw-k8s-general
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        name: Checkout code
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        name: Setup Helm
      - name: Run helm lint
        run: helm lint deployments/helm/k8s-dra-driver-npu